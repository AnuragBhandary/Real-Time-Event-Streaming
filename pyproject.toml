[project]
name = "livefeed"
version = "1.0.0"
description = "Real-time event streaming: ordered events in PostgreSQL, WebSocket fan-out across instances via Redis pub/sub, cursor resume, bounded replay and backpressure."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Anurag Bhandary" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "asyncpg>=0.30",
    "redis>=5.0",
    "orjson>=3.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.scripts]
livefeed = "livefeed.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livefeed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
markers = ["chaos: multi-process failure tests (spawn and kill real server processes)"]

[tool.coverage.run]
source = ["livefeed"]
omit = ["*/livefeed/__main__.py"]
branch = true
concurrency = ["thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = ["B008", "RUF012", "UP040", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC109"]
"bench/**" = ["ASYNC109"]

[tool.mypy]
python_version = "3.12"
packages = ["livefeed"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "prometheus_client.*"]
ignore_missing_imports = true
