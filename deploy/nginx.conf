# Load balancer in front of the livefeed instances. WebSockets are long-lived, so least_conn
# spreads connections by current load rather than by arrival order.
worker_processes auto;
events { worker_connections 8192; }

http {
    access_log off;

    upstream livefeed {
        least_conn;
        server livefeed1:8000 max_fails=1 fail_timeout=2s;
        server livefeed2:8000 max_fails=1 fail_timeout=2s;
        server livefeed3:8000 max_fails=1 fail_timeout=2s;
        keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 80;
        location / {
            proxy_pass http://livefeed;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
