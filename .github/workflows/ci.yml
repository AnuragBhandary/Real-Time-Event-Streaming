name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: livefeed
          POSTGRES_PASSWORD: livefeed
          POSTGRES_DB: livefeed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U livefeed" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Tests (unit, integration, multi-process chaos) with a 90% coverage gate
        run: uv run pytest --cov --cov-report=term --cov-fail-under=90

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and component tests with a coverage gate
        run: npm run coverage
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image, start 3 instances behind nginx, stream events end to end
        run: |
          docker compose up -d --build --wait
          pip install -q websockets httpx orjson
          python - <<'PY'
          import asyncio, json, sys
          sys.path.insert(0, "src")
          from livefeed.client import Producer, Subscription

          KEY = "lf_0000000000de_local-dev-key-not-for-production"

          async def main():
              async with Producer("http://localhost:8080", KEY) as p:
                  await p.create_stream("ci", kind="match")
                  subs = [Subscription("ws://localhost:8080", "ci") for _ in range(6)]
                  seen = [[] for _ in subs]

                  async def consume(i, s):
                      async for item in s:
                          seen[i].append(item.seq)
                          if item.seq >= 21:
                              return

                  tasks = [asyncio.create_task(consume(i, s)) for i, s in enumerate(subs)]
                  await asyncio.sleep(1)
                  await p.publish("ci", "match_started", {"teams": ["A", "B"]})
                  for _ in range(20):
                      await p.publish("ci", "score", {"team": "A", "points": 1})
                  await asyncio.wait_for(asyncio.gather(*tasks), 20)
              assert all(s[-20:] == list(range(2, 22)) for s in seen), seen
              print("6 clients across 3 instances received seq 1..21 in order")

          asyncio.run(main())
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browser end to end (drops, rolling restarts, a SIGKILL) against the running stack
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
